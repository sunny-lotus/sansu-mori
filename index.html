<!doctype html>
<html lang="ja">
<head>
<!-- このファイルだけで 開ける版。絵などは 公開中の さんすうの森から 読みこむ（ネットが いる） -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>さんすうの森</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 決まり（AIへのおねがい.md）：紙・すみ色の線2px・角14px・さわると浮いて影・余白は8の倍数・文字は13/16/20/28。
   さんすうの森らしさ：原っぱの背景、森の緑、いまの キャンプの黄色。 */
:root{--paper:#fbf7f0;--ink:#2b2118;--mute:#8c7f70;--line:#d9cdbb;--white:#fff;
  --theme:#3fae7a;--theme-soft:#dcf3e8;--now:#f2a516;--now-soft:#fde3a6;--ng:#d9483b;--r:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:hidden}
html,body{margin:0;color:var(--ink)}
body{font-family:"BIZ UDPGothic",sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;min-height:100vh;background:var(--paper)}
.k{font-family:"Klee One",serif;font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--ink);border-radius:var(--r);background:var(--white);padding:8px 16px;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s ease;box-shadow:0 0 0 var(--ink)}
button:hover{transform:translateY(-4px);box-shadow:0 5px 0 var(--ink)}
button:active{transform:translateY(1px);box-shadow:0 0 0 var(--ink);transition-duration:.06s}
button:disabled{opacity:.45;cursor:default}
button:disabled:hover{transform:none;box-shadow:none}
.dark{background:var(--ink);color:var(--paper)}
.lion{display:block}
.lion img{display:block;height:100%;width:auto}
header.bar{display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;background:rgba(251,247,240,.92);border-bottom:2px solid var(--line);position:relative;z-index:2}
header.bar h1{margin:0;font-size:20px}
header.bar .back{border:none;background:none;padding:8px 0;font-weight:700}
header.bar .back:hover{transform:none;box-shadow:none}
header.bar .sp{flex:1}
header.bar .link{font-size:13px;border-radius:999px;padding:4px 16px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:16px 24px}

/* 原っぱの背景（森の地図と 山の地図）。絵の 空の 暗い かげは、絵そのものを 水色に ぬりかえて ある。
   画面が 縦長でも 空が 足りるように、上は 同じ 水色で つなぐ。 */
body.outdoor{background:#d1e7f5 url("https://sunny-lotus.github.io/sansu-mori/common/img/bg-harappa.jpg") center bottom/cover no-repeat}
/* 森の地図だけは、先生の「森の小道」の絵 */
body.outdoor.forestbg{background:#a9d24f url("https://sunny-lotus.github.io/sansu-mori/common/img/bg-mori.jpg") center/cover no-repeat}
body.outdoor header.bar{background:rgba(251,247,240,.85)}

/* 材料の かず */
.mats{display:flex;gap:8px}
.mat{display:flex;align-items:center;gap:4px;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:0 12px 0 4px;font-weight:700;font-size:20px}
.mat img{height:32px;width:auto}
.mat.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.cost{display:flex;gap:4px;flex-wrap:wrap;font-size:13px;font-weight:700}
.cost span{display:flex;align-items:center;gap:2px}
.cost img{height:20px;width:auto}
.cost .lack{color:var(--ng)}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:20;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:4px 16px 4px 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;animation:toast 1.8s ease forwards;pointer-events:none}
.toast img{height:36px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}

/* ---------- 森の地図 ---------- */
.forest{position:relative;height:560px}
.forest .spot{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:none;background:none;padding:0;box-shadow:none}
.forest .spot:hover{transform:translate(-50%,-100%) translateY(-4px);box-shadow:none}
.forest .spot .tag{background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:0 16px;font-weight:700;font-size:16px;white-space:nowrap}
.forest .mini{display:block;width:360px;pointer-events:none}
.forest .mini .board{width:100%}
.forest .mtn{height:200px;width:auto}
/* まだ ひみつの 場所：先生の 島の絵を、うすく 見せる */
.forest .isle{position:relative;display:block;width:150px}
.forest .isle img{display:block;width:100%;height:auto;filter:grayscale(.85) brightness(1.05);opacity:.75}
.forest .isle b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--white);border:2px solid var(--ink);display:grid;place-items:center;font-size:28px}
.forest .spot:disabled{cursor:default;opacity:1}
.forest .spot:disabled:hover{transform:translate(-50%,-100%)}
.forest .guide{position:absolute;right:24px;top:24px;width:320px}

/* らいおんの 会話（森・山・キャンプで つかう） */
.talk{display:flex;flex-direction:column;gap:8px}
.talk .row{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:end;animation:rise .35s ease} /* 動きが 止まって いても 見えるように、both に しない */
.talk .row.niji{grid-template-columns:1fr 56px}
.talk .row.niji .lion{order:2}
.talk .row .lion{height:64px}
.talk .bub{background:var(--white);border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:8px 16px;font-size:16px;line-height:1.6}
.talk .row.niji .bub{border-radius:18px 18px 4px 18px;border-color:#7b5cff}
.talk .row.hint .bub{border-color:var(--now)}
.talk .ctl{display:flex;gap:8px;justify-content:flex-end}
.talk .ctl button{font-size:13px;padding:4px 16px;border-radius:999px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- がい数の森の 地図 ---------- */
.mapwrap{display:grid;grid-template-columns:1fr 280px;gap:24px;align-items:start}
.map{width:100%;height:auto;display:block}
.camp{cursor:pointer}
.camp .pic{transition:transform .18s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center bottom}
.camp:hover .pic{transform:translateY(-4px) scale(1.08)}
.camp.now .pic{animation:hop 1.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.camp .tag{transition:transform .18s}
.camp:hover .tag{transform:translateY(-3px)}
.camps{display:flex;flex-direction:column;gap:8px}
.camps button{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 16px}
.num{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);font-weight:700;font-size:13px;flex:none;background:var(--white)}
.done .num{background:var(--theme);color:var(--white)}
.now .num{background:var(--now)}
.title{display:flex;align-items:baseline;gap:16px;margin:0 0 8px}
.title h2{margin:0;font-size:28px;text-shadow:0 0 6px #fff}
.title span{color:var(--mute);text-shadow:0 0 6px #fff}

/* ---------- キャンプの中 ---------- */
.campv{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.qcard{background:var(--white);border:2px solid var(--ink);border-radius:var(--r);padding:24px}
.step{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px;font-weight:700;margin-bottom:8px}
.step i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.step i.ok{background:var(--theme)}
.step i.cur{background:var(--now)}
.qcard h3{margin:0 0 16px;font-size:28px;line-height:1.6}
.bignum{display:flex;gap:8px;margin:8px 0 16px;flex-wrap:wrap}
.bignum .d{display:flex;flex-direction:column;align-items:center;gap:4px}
.bignum .d b,.bignum .d button{display:grid;place-items:center;width:56px;height:64px;border:2px solid var(--ink);border-radius:10px;font-size:36px;background:var(--white);padding:0;font-family:"Klee One",serif;font-weight:600}
.bignum .d small{font-size:13px;color:var(--mute);min-height:1.5em;font-weight:700}
.bignum .d.keep b{background:var(--theme-soft)}
.bignum .d.look b{background:var(--now-soft);outline:3px solid var(--now);outline-offset:2px}
.bignum .d.zero b{color:var(--mute);background:#efe8dc}
.bignum .d.target button{outline:3px dashed var(--now);outline-offset:3px}
.bignum .d.wrong button{background:#fbe1dd}
.bignum .d.right button{background:var(--theme-soft)}
.bignum .d .top{font-size:13px;color:var(--now);font-weight:700;min-height:1.5em}
.bignum.explore .d button{width:44px;height:52px;font-size:28px}
.bignum.explore .d.on button{background:var(--now-soft)}
.ansrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ansrow input{font-family:"Klee One",serif;font-weight:600;font-size:28px;width:6.5em;padding:4px 16px;border:2px solid var(--ink);border-radius:var(--r);text-align:right;background:var(--white)}
.ansrow input:focus{outline:3px solid var(--now);outline-offset:2px}
.ansrow input.ok{background:var(--theme-soft)}
.ansrow input.ng{background:#fbe1dd}
.ansrow button{font-size:20px;font-weight:700;padding:8px 24px}
.ansrow .lbl{font-size:20px;min-width:5em}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.methods .ansrow{flex-direction:column;align-items:stretch;gap:8px}
.methods .ansrow .lbl{min-width:0}
.methods .ansrow input{width:100%}
.tool{margin-top:16px;padding-top:16px;border-top:2px dashed var(--line)}
.tool h4{margin:0 0 8px;font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool h4 button{font-size:13px;padding:2px 12px;border-radius:999px}
.nl{width:100%;height:auto;display:block;touch-action:none;cursor:pointer}
.nlctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.nlctl .stepb{padding:4px 12px;font-size:16px}
.nlctl .val{font-size:28px;min-width:4.5em;text-align:right}
.found{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.found span{border:2px solid var(--theme);background:var(--theme-soft);border-radius:999px;padding:0 16px;font-size:20px}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
.side .lvl{display:flex;gap:4px;justify-content:center;align-items:center;font-size:13px;color:var(--mute)}
.side .lvl i{width:24px;height:6px;border-radius:3px;background:var(--line)}
.side .lvl i.on{background:var(--now)}
.side .more{align-self:center;font-size:13px;border-radius:999px;padding:4px 16px}
.arrowanim{stroke-dasharray:400;stroke-dashoffset:400;animation:drawline .9s ease forwards}
@keyframes drawline{to{stroke-dashoffset:0}}

/* ---------- キャンプ場 ---------- */
.campsite{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
/* 長おししても 文字や 絵が 選ばれない（青く ならない）ように する */
.campsite,.campsite *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.campsite img{-webkit-user-drag:none}
/* キャンプ場の 地面：先生の「木のわくと 森の 原っぱ」の絵 */
.board{position:relative;aspect-ratio:3/2;border-radius:var(--r);overflow:hidden;touch-action:none;
  background:#b9df7e url("https://sunny-lotus.github.io/sansu-mori/common/img/camp/ground-forest.jpg") center/100% 100% no-repeat}
.board .it{position:absolute;transform:translate(-50%,-100%);cursor:grab;filter:drop-shadow(0 4px 0 rgba(43,33,24,.25));transition:transform .18s cubic-bezier(.3,1.6,.5,1);z-index:1}
.board .it:hover{transform:translate(-50%,-100%) translateY(-4px) scale(1.04)}
.board .it img{display:block;height:100%;width:auto;pointer-events:none}
.board .it.new{animation:build .7s cubic-bezier(.2,.9,.3,1.4)}
@keyframes build{0%{transform:translate(-50%,-100%) scale(.2);opacity:0}70%{transform:translate(-50%,-100%) scale(1.12);opacity:1}100%{transform:translate(-50%,-100%)}}
.board .it.sel{outline:4px solid var(--now);outline-offset:4px;border-radius:12px}
.board .visit{position:absolute;display:block;height:22%;transform:translate(-50%,-100%);animation:hop2 1.4s ease-in-out infinite;z-index:2}
.board .visit img{display:block;height:100%;width:auto}
@keyframes hop2{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-108%)}}
.board .spark{position:absolute;pointer-events:none;font-size:28px;animation:spark .9s ease-out forwards;z-index:3}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-160%) scale(1.3)}}
.pop{position:absolute;z-index:4;background:var(--white);border:2px solid var(--ink);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:180px;transform:translate(-50%,8px)}
.pop button{font-size:13px;padding:4px 8px}
.panel{display:flex;flex-direction:column;gap:8px}
.panel h2{margin:0;font-size:20px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shop button{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;text-align:left;padding:4px 8px}
.shop button img{height:40px;width:auto;max-width:44px;object-fit:contain;justify-self:center}
.shop .nm{font-weight:700;font-size:16px;line-height:1.3}
.tray{display:flex;gap:8px;flex-wrap:wrap}
.tray .ti{display:flex;flex-direction:column;align-items:center;gap:4px;width:88px;padding:8px;touch-action:none;border:2px solid var(--ink);border-radius:var(--r);background:var(--white);cursor:grab}
.tray .ti img{height:44px;width:auto;pointer-events:none}
.tray .ti span{font-size:13px;font-weight:700}
.ghost{position:fixed;pointer-events:none;z-index:30;transform:translate(-50%,-100%);opacity:.85}
.ghost img{height:96px;width:auto}
.note{font-size:13px;color:var(--mute);margin:0}

/* QR と おしらせの まど */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(251,247,240,.85);z-index:40}
.modal .box{background:var(--white);border:2px solid var(--ink);border-radius:var(--r);padding:24px;max-width:520px;width:calc(100% - 32px);text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:none}}
.modal .lions{display:flex;gap:16px;justify-content:center;height:120px}
.modal .lions .lion{height:100%}
.modal h2{font-size:28px;margin:8px 0}
.modal p{font-size:16px;margin:0 0 16px}
.modal .qr img{width:240px;height:240px;image-rendering:pixelated}
.modal .row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){.camp.now .pic,.board .it.new,.board .visit,.mat.bump,.board .spark,.talk .row,.modal .box,.toast,.arrowanim{animation:none}.arrowanim{stroke-dashoffset:0}button{transition:none}}
@media (max-width:820px){
  main{padding:16px}
  .mapwrap,.campv,.campsite{grid-template-columns:1fr}
  .side{position:static;order:-1}
  .bignum .d b,.bignum .d button{width:44px;height:52px;font-size:28px}
  .qcard{padding:16px}
  .qcard h3{font-size:20px}
  .ansrow input{font-size:20px;width:6em}
  .methods{grid-template-columns:1fr;gap:8px}
  header.bar{padding:0 16px;gap:8px}
  header.bar h1{font-size:16px}
  .mat{font-size:16px}
  .mat img{height:24px}
  .mats{gap:4px}
  .mat{white-space:nowrap;padding:0 8px 0 2px}
  header.bar{flex-wrap:wrap;height:auto;min-height:56px;padding:8px 16px}
  header.bar h1,header.bar a,header.bar button{white-space:nowrap}
  /* スマホでは 森の場所を 上から じゅんに ならべる（重ならないように） */
  .forest{height:auto!important;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:24px 16px;padding-bottom:24px}
  .forest .spot,.forest .spot:hover,.forest .spot:disabled:hover{position:static;transform:none}
  .forest .guide{position:static;width:100%;padding:16px;order:-1}
  .forest .mini{width:300px}
  .forest .mtn{height:140px}
  .forest .isle{width:96px}
  .forest .isle b{width:40px;height:40px;font-size:20px}
  .forest .spot .tag{font-size:13px;padding:0 8px}
}
.board .camp-lion{padding:0;border:0;background:transparent;box-shadow:none;min-width:0;touch-action:none;cursor:grab;transition:none;line-height:0}
.board .camp-lion:hover{background:transparent;transform:translate(-50%,-100%)}
.board .camp-lion:focus-visible{outline:3px solid #285db3;outline-offset:4px;border-radius:18px}
.board .camp-lion.moving{animation:none;cursor:grabbing;z-index:5}
.board .camp-lion.waving{animation:camp-wave .5s ease-in-out}
@keyframes camp-wave{0%,100%{transform:translate(-50%,-100%) rotate(0)}25%{transform:translate(-50%,-110%) rotate(-9deg)}75%{transform:translate(-50%,-110%) rotate(9deg)}}
@media(prefers-reduced-motion:reduce){.board .camp-lion.waving{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>

<script src="https://sunny-lotus.github.io/sansu-mori/common/lions.js"></script>
<!-- QRコード：qrcode-generator（Kazuhiko Arase さん、MIT ライセンス） -->
<script src="https://sunny-lotus.github.io/sansu-mori/common/qrcode.min.js"></script>
<script>
/* ================= 問題（先生チェックは まだ） ================= */
const PLACES = ["一", "十", "百", "千", "一万", "十万"];
const MNAME = { half: "四捨五入", up: "切り上げ", down: "切り捨て" };
const MTO = { half: "四捨五入すると", up: "切り上げると", down: "切り捨てると" };
const CAMPS = [
  { name: "位の なまえ", mat: "donguri", qs: [{ n: 58372, p: 3 }, { n: 64915, p: 4 }, { n: 37208, p: 2 }, { n: 91546, p: 1 }, { n: 250813, p: 5 }, { n: 473062, p: 4 }] },
  { name: "四捨五入", mat: "donguri", qs: [{ n: 36482, u: 10000 }, { n: 74915, u: 10000 }, { n: 25061, u: 10000 }, { n: 48351, u: 1000 }, { n: 62790, u: 1000 }, { n: 17509, u: 1000 }] },
  { name: "切り上げ・切り捨て", mat: "maki", qs: [{ n: 43200 }, { n: 68751 }, { n: 85000 }, { n: 50000 }] },
  { name: "数直線で ためす", mat: "maki", qs: [{ m: "half", T: 90000 }, { m: "up", T: 70000 }, { m: "down", T: 30000 }, { m: "half", T: 50000 }] },
  { name: "はんいを 見つける", mat: "tane", qs: [{ m: "up", T: 90000 }, { m: "down", T: 90000 }, { m: "half", T: 90000 }, { m: "up", T: 7000, u: 1000 }, { m: "half", T: 3000, u: 1000 }, { m: "down", T: 600, u: 100 }, { m: "up", T: 400, u: 100 }] },
];
const FIND = 2; // キャンプ④で 見つける 数
// キャンプに 入ったときの らいおんの かけあい
const INTRO = [
  [["hana", "happy", "キャンプ①へ ようこそ！"], ["niji", "normal", "大きな 数の 数字には、右から 一・十・百・千・一万…と 位の 名前が ついて いるんだ。"], ["hana", "idea", "下の 「さわって しらべよう」の 数字を おすと、位の 名前が わかるよ。ためしてみて！"]],
  [["niji", "normal", "四捨五入は、1つ 下の 位の 数字を 見て きめるよ。"], ["hana", "idea", "4までは そのまま、5からは 上がる！"], ["niji", "normal", "下の 数直線の ● を ゆびで うごかして、たしかめてみよう。"]],
  [["hana", "happy", "同じ 数でも、やり方で がい数が かわるんだって！"], ["niji", "normal", "切り捨ては 下へ、切り上げは 上へ、四捨五入は 近いほうへ 行くよ。"], ["hana", "idea", "下の ボタンを おすと、矢印で 見せて くれるよ。"]],
  [["niji", "normal", "数直線の ▲を ゆびで うごかしてみよう。"], ["hana", "happy", "「この 数で ためす」を おすと、ぼくたちが すぐ 答えを 言うよ。"]],

/* ================= 計算 ================= */
function rnd(n, m, u) { const r = ((n % u) + u) % u, base = n - r; if (m === "up") return r ? base + u : n; if (m === "down") return base; return r >= u / 2 ? base + u : base; }
function range(m, T, u) { if (m === "up") return [T - u + 1, T]; if (m === "down") return [T, T + u - 1]; return [T - u / 2, T + u / 2 - 1]; }
const exp = (u) => String(u).length - 1;
const toPlace = (u) => PLACES[exp(u)];
const lookPlace = (u) => PLACES[exp(u) - 1];
const num = (s) => { s = String(s || "").replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/[^\d]/g, ""); return s ? parseInt(s, 10) : null; };

function blank() { return { cleared: [false, false, false, false, false], mats: { donguri: 0, maki: 0, tane: 0 }, lv: {}, pos: {} }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.cleared)) return Object.assign(blank(), s); } catch (e) {}
  const b = blank();
  // 前の 算数マウンテンで のぼった キャンプを ひきつぐ
  try { const old = JSON.parse(localStorage.getItem("sansu-mountain-v1")); if (old && Array.isArray(old.cleared)) b.cleared = old.cleared; } catch (e) {}
  return b;
}
let prog = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }
const nowCamp = () => { const i = prog.cleared.indexOf(false); return i < 0 ? 4 : i; };
const stateOf = (i) => prog.cleared[i] ? "done" : i === nowCamp() ? "now" : "todo";

function packSave() { return btoa(unescape(encodeURIComponent(JSON.stringify({ c: prog.cleared.map((x) => x ? 1 : 0).join(""), m: [prog.mats.donguri, prog.mats.maki, prog.mats.tane], l: prog.lv, p: prog.pos })))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unpackSave(s) {
  const o = JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))));
  return { cleared: o.c.split("").map((x) => x === "1"), mats: { donguri: o.m[0] | 0, maki: o.m[1] | 0, tane: o.m[2] | 0 }, lv: o.l || {}, pos: o.p || {} };
}

/* ================= 数直線（ゆびで うごかせる） ================= */
let nl = null;
function nlInit(m, T, u, start) { nl = { m, T, u, min: T - 1.5 * u, max: T + 1.5 * u, v: start, tried: [], zone: false, mark: false }; }
const NX = (n) => 20 + (n - nl.min) / (nl.max - nl.min) * 620;
function nlSVG() {
  const { m, T, u, min, max, v } = nl;
  let s = `<rect x="0" y="0" width="660" height="104" fill="transparent"/>`;
  if (nl.zone) { const [a, b] = range(m, T, u); s += `<rect x="${NX(a)}" y="36" width="${NX(b) - NX(a)}" height="40" rx="6" fill="#dcf3e8" stroke="#3fae7a" stroke-width="2"/>`; }
  if (nl.mark) s += `<path d="M${NX(T)} 6 v20" stroke="#f2a516" stroke-width="4" stroke-linecap="round"/><text x="${NX(T)}" y="6" text-anchor="middle" font-size="13" font-weight="700" fill="#f2a516" font-family="BIZ UDPGothic">${T}の 近く</text>`;
  s += `<line x1="8" y1="56" x2="652" y2="56" stroke="#2b2118" stroke-width="3"/>`;
  for (let n = min; n <= max; n += u / 10) {
    const big = n % u === 0, h = big ? 14 : n % (u / 2) === 0 ? 10 : 5;
    s += `<line x1="${NX(n)}" y1="${56 - h}" x2="${NX(n)}" y2="${56 + h}" stroke="#2b2118" stroke-width="${big ? 3 : 1.5}"/>`;
    if (big) s += `<text x="${NX(n)}" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2118" font-family="Klee One">${n}</text>`;
  }
  nl.tried.forEach((t) => { s += `<circle cx="${NX(t)}" cy="56" r="6" fill="${rnd(t, m, u) === T ? "#3fae7a" : "#b9ad9a"}" stroke="#fff" stroke-width="1.5"/>`; });
  const r = rnd(v, m, u), ok = r === T;
  if (r !== v && r >= min && r <= max) s += `<path d="M${NX(v)} 44 Q${(NX(v) + NX(r)) / 2} 4 ${NX(r)} 44" fill="none" stroke="${ok ? "#3fae7a" : "#d9483b"}" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  s += `<path d="M${NX(v)} 60 l-11 18 h22z" fill="${ok ? "#3fae7a" : "#d9483b"}" stroke="#2b2118" stroke-width="1.5"/>`;
  return `<svg class="nl" id="nlsvg" viewBox="0 0 660 104" aria-label="数直線。ゆびで ▲を うごかせる">${s}</svg>`;
}
function nlHTML(tryLabel) {
  const steps = [nl.u / 10, nl.u / 100, 1].filter((d, i, a) => d >= 1 && a.indexOf(d) === i);
  return `<div id="nlbox">${nlSVG()}
    <div class="nlctl">${steps.map((d) => `<button class="stepb" onclick="nlSet(nl.v-${d},true)">−${d}</button>`).join("")}
      <span class="val k" id="nlval">${nl.v}</span>
      ${steps.slice().reverse().map((d) => `<button class="stepb" onclick="nlSet(nl.v+${d},true)">+${d}</button>`).join("")}
      ${tryLabel ? `<button class="dark" onclick="nlTry()">${tryLabel}</button>` : ""}
      <span class="note" id="nlres">${MTO[nl.m]} ${rnd(nl.v, nl.m, nl.u)}</span></div></div>`;
}
function nlSet(v, record) {
  nl.v = Math.max(nl.min, Math.min(nl.max, Math.round(v)));
  if (record && ci === 4) nl.tried.push(nl.v);
  const svg = $("nlsvg"); if (!svg) return;
  svg.outerHTML = nlSVG(); $("nlval").textContent = nl.v; $("nlres").textContent = `${MTO[nl.m]} ${rnd(nl.v, nl.m, nl.u)}`;
}
// 数直線を ゆびで さわって うごかす
let nlDrag = false;
function svgX(svg, e, w) { const r = svg.getBoundingClientRect(); return (e.clientX - r.left) / r.width * w; }
document.addEventListener("pointerdown", (e) => {
  const svg = e.target.closest && e.target.closest("#nlsvg"); if (svg && nl) { nlDrag = true; e.preventDefault(); moveNL(e); }
  const ms = e.target.closest && e.target.closest("#minisvg"); if (ms && mini) { miniDrag = true; e.preventDefault(); moveMini(e); }
});
document.addEventListener("pointermove", (e) => { if (nlDrag) moveNL(e); if (miniDrag) moveMini(e); });
document.addEventListener("pointerup", () => { if (nlDrag && ci === 4 && nl) { nl.tried.push(nl.v); nlSet(nl.v); } nlDrag = false; miniDrag = false; });
function moveNL(e) { const svg = $("nlsvg"); if (!svg) return; const x = svgX(svg, e, 660), step = nl.u / 100; nlSet(Math.round((nl.min + (x - 20) / 620 * (nl.max - nl.min)) / step) * step); }

/* ---------- キャンプ①：位の なまえ ---------- */
function camp1(q) {
  const ds = String(q.n).split(""), Ln = ds.length, target = Ln - 1 - q.p, lvl = Math.min(miss, 3);
  const showNames = solved || lvl >= 2;
  const card = `<h3 class="k">${PLACES[q.p]}の位の 数字を タップしよう。</h3>
    <div class="bignum">${ds.map((d, i) => {
      const cls = solved && i === target ? "right" : X.wrong === i ? "wrong" : lvl >= 3 && i === target ? "target" : "";
      return `<span class="d ${cls}"><span class="top">${showNames ? PLACES[Ln - 1 - i] + "の位" : ""}</span><button ${solved ? "disabled" : ""} onclick="c1Tap(${i})">${d}</button></span>`;
    }).join("")}</div>`;
  // さわって しらべよう：おしても 答えに ならない。位の 名前を 教えて くれる
  const tool = `<h4>さわって しらべよう（ここは おしても 答えに ならないよ）</h4>

  const msg = campSay || (Object.keys(prog.lv).length ? ["hana", "happy", "すてきな キャンプ場だね！ おいた ものは、ドラッグで うごかせるよ。"] : ["hana", "happy", "ここが きみの キャンプ場！ 材料を つかって ものを つくろう。"]);
  return `<header class="bar"><button class="back" onclick="go('forest')">◀ 森へ</button><h1 class="k">きみの キャンプ場</h1><span class="sp"></span>
    <button class="link" onclick="showQR()">べつの 端末で つづける（QR）</button>${matsHTML()}</header>
  <main><div class="campsite">
    <div style="position:relative">${boardHTML(false)}
      ${sel && prog.pos[sel.key] ? `<div class="pop" style="left:${prog.pos[sel.key][0]}%;top:${prog.pos[sel.key][1]}%">
        <b class="k">${sel.name}</b>${nextCost(sel) ? `<button class="dark" ${canPay(nextCost(sel)) ? "" : "disabled"} onclick="build('${sel.key}')">大きくする</button>${costHTML(nextCost(sel))}` : "<span class='cost'>いちばん 大きいよ</span>"}
        <button onclick="campSel=null;render()">とじる</button></div>` : ""}
    </div>
    <aside class="panel">
      ${talkHTML([msg])}
      <h2 class="k">つくる</h2>
      <div class="shop">${ITEMS.filter((it) => !lvOf(it.key)).map((it) => `<button onclick="build('${it.key}')" ${canPay(nextCost(it)) ? "" : "disabled"}><img src="${campImg(it.stages[0][0])}" alt=""><span><span class="nm k">${it.name}</span><br>${costHTML(nextCost(it))}</span></button>`).join("") || "<p class='k' style='margin:0'>ぜんぶ つくったよ！</p>"}</div>
      ${notPlaced.length ? `<h2 class="k">おく（キャンプ場へ ドラッグ）</h2><div class="tray">${notPlaced.map((it) => `<span class="ti" data-k="${it.key}" onpointerdown="dragStart(event,'${it.key}')"><img src="${campImg(it.stages[lvOf(it.key) - 1][0])}" alt=""><span>${it.name}</span></span>`).join("")}</div>` : `<p class="note">おいた ものを おすと、大きく できるよ。</p>`}
    </aside></div></main>`;
}
function build(key) {
  const it = itemOf(key), c = nextCost(it);
  if (!canPay(c)) { campSay = ["niji", "think", `${it.name}には、材料が もう少し いるよ。がい数の 森で 問題を といて あつめよう！`]; render(); return; }
  for (const [m, n] of Object.entries(c)) prog.mats[m] -= n;
  prog.lv[key] = lvOf(key) + 1; justBuilt = key; save();
  campSay = lvOf(key) === 1 ? ["hana", "happy", `${it.name}が できた！ キャンプ場へ ドラッグして おいてね。`] : ["hana", "happy", `${it.name}が 大きく なったよ！`];
  if (key === "house" && lvOf(key) === 2) campSay = ["niji", "happy", "大きい 家が できた！ ぼくたちも あそびに 来たよ！"];
  render(); justBuilt = null;
  if (prog.pos[key]) spark(key);
}
function spark(key) {
  const it = itemOf(key), p = prog.pos[key], b = $("board"); if (!b || !p) return;
  for (let i = 0; i < 3; i++) { const s = document.createElement("span"); s.className = "spark"; s.textContent = ["✨", "🌟", "✨"][i];
    s.style.left = (p[0] + (i - 1) * 4) + "%"; s.style.top = (p[1] - it.h / 2) + "%"; s.style.animationDelay = i * 0.12 + "s"; b.appendChild(s); setTimeout(() => s.remove(), 1300); }
}
// ドラッグして おく（おいた ものも、もう一度 ドラッグで うごかせる。おすだけなら「大きくする」）
let drag = null;
function dragStart(e, key) {
  e.preventDefault();
  const it = itemOf(key), g = document.createElement("div"); g.className = "ghost"; g.innerHTML = `<img src="${campImg(it.stages[lvOf(key) - 1][0])}" alt="">`;
  document.body.appendChild(g); drag = { key, g }; dragMove(e);
}
function dragMove(e) { if (!drag) return; drag.g.style.left = e.clientX + "px"; drag.g.style.top = e.clientY + "px"; }
function dragEnd(e) {
  if (!drag) return; const b = $("board"), r = b && b.getBoundingClientRect();
  if (r && e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) {
    // 木のわくの 内がわ（原っぱ）に おさまるように
    const x = Math.max(12, Math.min(88, (e.clientX - r.left) / r.width * 100)), y = Math.max(26, Math.min(88, (e.clientY - r.top) / r.height * 100));
    prog.pos[drag.key] = [Math.round(x), Math.round(y)]; save(); campSel = null; campSay = ["hana", "happy", `${itemOf(drag.key).name}を おいたよ。いい 場所だね！`];
  }
  drag.g.remove(); drag = null; render();
}
window.addEventListener("pointermove", dragMove);
window.addEventListener("pointerup", dragEnd);
// キャンプ場で 長おし したとき、選択や メニューが 出ないように する
for (const ev of ["selectstart", "contextmenu"]) document.addEventListener(ev, (e) => { const t = e.target.nodeType === 3 ? e.target.parentElement : e.target; if (view === "site" && t && t.closest && t.closest(".campsite")) e.preventDefault(); });
document.addEventListener("pointerdown", (e) => {
  const t = e.target.closest && e.target.closest("#board .it"); if (view !== "site" || !t) return;
  const key = t.dataset.k, sx = e.clientX, sy = e.clientY; let moved = false;
  const mv = (ev) => { if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 8) { moved = true; window.removeEventListener("pointermove", mv); delete prog.pos[key]; campSel = null; render(); dragStart(ev, key); } };
  window.addEventListener("pointermove", mv);
  window.addEventListener("pointerup", () => { window.removeEventListener("pointermove", mv); if (!moved) { campSel = campSel === key ? null : key; render(); } }, { once: true });
});

/* ================= QR と おしらせ ================= */
function showModal(html) { const m = $("modal"); m.innerHTML = `<div class="box">${html}</div>`; m.hidden = false; }
function closeModal() { $("modal").hidden = true; }
function showQR() {
  const url = "https://sunny-lotus.github.io/sansu-mori/#load=" + packSave();
  let img = "";
  try { const qr = qrcode(0, "M"); qr.addData(url); qr.make(); img = qr.createImgTag(6, 8, "QRコード"); } catch (e) { img = "<p>QRコードを 作れなかったよ。</p>"; }
  showModal(`<div class="lions">${L("niji", "normal")}</div><h2 class="k">べつの 端末で つづける</h2>
    <p class="k">べつの 端末の カメラで、この QR を 読んでね。<br>キャンプ場と、クリアした キャンプが そのまま つづくよ。</p>
    <div class="qr">${img}</div><div class="row"><button class="dark" onclick="closeModal()">とじる</button></div>`);
}
// QR から 来たとき：この端末で つづけるか きく
function checkLoad() {
  const m = location.hash.match(/^#load=([A-Za-z0-9_-]+)$/); if (!m) return;
  let data = null; try { data = unpackSave(m[1]); } catch (e) {}
  history.replaceState(null, "", location.pathname);
  if (!data) { showModal(`<h2 class="k">QRを 読めなかったよ</h2><p class="k">もう一度 読んでみてね。</p><div class="row"><button class="dark" onclick="closeModal()">とじる</button></div>`); return; }
  window.__load = data;
  showModal(`<div class="lions">${L("hana", "happy")}${L("niji", "normal")}</div><h2 class="k">つづきが 見つかったよ</h2>
    <p class="k">クリアした キャンプ ${data.cleared.filter(Boolean).length}／5、つくった もの ${Object.keys(data.lv).length}こ。<br>この 端末で つづける？（いまの この端末の きろくは 上書きされるよ）</p>
    <div class="row"><button onclick="closeModal()">やめる</button><button class="dark" onclick="prog=Object.assign(blank(),window.__load);save();closeModal();render()">つづける</button></div>`);
}

/* ================= 表示 ================= */
function render() {
  cancelCampLionDrag();
  $("app").innerHTML = view === "forest" ? vForest() : view === "map" ? vMap() : view === "site" ? vSite() : vCamp();
  document.body.classList.toggle("outdoor", view === "forest" || view === "map");
  document.body.classList.toggle("forestbg", view === "forest" || view === "map");
  fitForest();
  const first = document.querySelector(".qcard input:not([disabled])"); if (first && !solved && intro < 0) first.focus({ preventScroll: true });
}
// Positions share the existing local save and QR transfer data.
const campLionNames = { hana: 'はなまらいおん', niji: 'にじまらいおん' };
function campLionPosition(key) {
  const p = prog.pos['lion-' + key];
  return Array.isArray(p) && p.length === 2 && p.every(Number.isFinite)
    ? [Math.max(8, Math.min(92, p[0])), Math.max(25, Math.min(95, p[1]))]
    : key === 'hana' ? [38, 72] : [62, 76];
}
function campLionsHTML(mini) {
  return Object.keys(campLionNames).map(key => {
    const [x,y] = campLionPosition(key), style = `left:${x}%;top:${y}%;animation-delay:${key === 'niji' ? '-.7s' : '0s'}`;
    const art = Lions.svg(key, key === 'hana' ? 'happy' : 'normal');
    return mini ? `<span class="visit" style="${style}">${art}</span>`
      : `<button type="button" class="visit camp-lion" data-lion="${key}" style="${style}" aria-label="${campLionNames[key]}。ドラッグや矢印キーで動かす">${art}</button>`;
  }).join('');
}
let campLionDrag = null;
function cancelCampLionDrag() {
  if (!campLionDrag) return;
  const d = campLionDrag; campLionDrag = null;
  d.node.style.left = d.start[0] + '%'; d.node.style.top = d.start[1] + '%';
  d.node.classList.remove('moving');
  try { d.node.releasePointerCapture(d.id); } catch (_) {}
}
document.addEventListener('pointerdown', e => {
  const node = e.target.closest?.('#board .camp-lion');
  if (view !== 'site' || !node || campLionDrag || (e.button !== undefined && e.button !== 0) || e.isPrimary === false) return;
  const board = node.closest('#board'), rect = board.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  e.preventDefault(); node.focus({preventScroll:true});
  campLionDrag = { node, key:node.dataset.lion, id:e.pointerId, rect, start:campLionPosition(node.dataset.lion), x:e.clientX, y:e.clientY, moved:false };
  node.classList.add('moving');
  try { node.setPointerCapture(e.pointerId); } catch (_) {}
});
document.addEventListener('pointermove', e => {
  const d = campLionDrag; if (!d || e.pointerId !== d.id) return;
  if (view !== 'site' || !d.node.isConnected) { cancelCampLionDrag(); return; }
  const dx = e.clientX-d.x, dy = e.clientY-d.y;
  if (!d.moved && Math.hypot(dx,dy) < 5) return;
  d.moved = true; e.preventDefault();
  d.position = [Math.max(8,Math.min(92,d.start[0]+dx/d.rect.width*100)),Math.max(25,Math.min(95,d.start[1]+dy/d.rect.height*100))];
  d.node.style.left = d.position[0]+'%'; d.node.style.top = d.position[1]+'%';
}, {passive:false});
document.addEventListener('pointerup', e => {
  const d = campLionDrag; if (!d || e.pointerId !== d.id) return;
  campLionDrag = null; d.node.classList.remove('moving');
  try { d.node.releasePointerCapture(d.id); } catch (_) {}
  if (view !== 'site' || !d.node.isConnected) return;
  if (d.moved) { prog.pos['lion-'+d.key] = d.position.map(n=>Math.round(n*10)/10); save(); }
});
document.addEventListener('pointercancel', e => { if (campLionDrag?.id === e.pointerId) cancelCampLionDrag(); });
document.addEventListener('lostpointercapture', e => { if (campLionDrag?.id === e.pointerId) cancelCampLionDrag(); }, true);
window.addEventListener('blur', cancelCampLionDrag);
document.addEventListener('click', e => {
  const node = e.target.closest?.('#board .camp-lion'); if (!node || view !== 'site') return;
  // A drag's click has no gameplay action. A tap makes the lion wave briefly.
  node.classList.remove('waving'); void node.offsetWidth; node.classList.add('waving');
});
document.addEventListener('keydown', e => {
  const node = e.target.closest?.('#board .camp-lion'), delta = {ArrowLeft:[-3,0],ArrowRight:[3,0],ArrowUp:[0,-3],ArrowDown:[0,3]}[e.key];
  if (!node || view !== 'site' || !delta) return;
  e.preventDefault(); const p = campLionPosition(node.dataset.lion);
  const next = [Math.max(8,Math.min(92,p[0]+delta[0])),Math.max(25,Math.min(95,p[1]+delta[1]))];
  prog.pos['lion-'+node.dataset.lion] = next; save(); node.style.left=next[0]+'%'; node.style.top=next[1]+'%';
});

render();
checkLoad();
</script>
</body>
</html>
